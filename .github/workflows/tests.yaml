# Build and test formula on PRs; produce bottle artifacts for publishing.

name: tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

# Default deny; the job grants only what test-bot needs.
permissions: {}

env:
  # Enable developer mode for stricter checks and verbose errors.
  HOMEBREW_DEVELOPER: 1
  # Adjust output formatting for CI.
  HOMEBREW_GITHUB_ACTIONS: 1
  # Prevent auto-update before every command to save time and avoid flakiness.
  HOMEBREW_NO_AUTO_UPDATE: 1
  # Use the local tap checkout instead of fetching formula metadata from the API.
  HOMEBREW_NO_INSTALL_FROM_API: 1
  # Skip tap trust check since the CI runner has not run brew trust.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
          - runner: macos-26
    runs-on: ${{ matrix.runner }}
    permissions:
      # Fetch the tap and run git operations for test-bot.
      contents: read
      # Detect which formulae the PR changed.
      pull-requests: read
      # Fetch existing bottles from this tap's GitHub Packages (ghcr.io).
      packages: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Reset GitHub runner Homebrew state
        run: brew test-bot --only-cleanup-before

      - name: Configure test environment
        run: brew test-bot --only-setup

      - name: Check formula syntax
        run: brew test-bot --only-tap-syntax

      - name: Build and test bottles
        run: |
          brew test-bot --only-formulae \
            --root-url="https://ghcr.io/v2/${{ github.repository_owner }}/vmnet-helper"

      - name: Upload bottle artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.runner }}
          path: '*.bottle.*'
          if-no-files-found: warn
